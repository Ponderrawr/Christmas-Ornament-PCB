; Christmas Ornament PCB - ATtiny85 firmware
; Programmer: FabISP (USBtiny firmware). Driver: libusb-win32 via Zadig.
[env:attiny85]
platform = atmelavr
board = attiny85
board_build.f_cpu = 1000000L
upload_protocol = usbtiny
; If you get "initialization failed", slow the ISP clock:
; upload_flags = -B32
